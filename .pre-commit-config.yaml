repos:
  - repo: local
    hooks:
      - id: sync-contracts-check
        name: Check generated contracts
        entry: python tools/sync_contracts.py --check
        language: system
        pass_filenames: false
        always_run: true

      - id: validate-data
        name: Validate data and locale
        entry: python tools/validate_data.py
        language: system
        pass_filenames: false
        always_run: true

      - id: module-bake-check
        name: Check generated module bake artifacts
        entry: python tools/godot_bridge.py --project client module-bake-check
        language: system
        pass_filenames: false
        files: ^(client/(scenes/generated/modules/|data/modules/|resources/modules/module_placeholder_tileset\.tres|scripts/editor/module_scene_baker\.gd|scripts/gameplay/generated_module_scene\.gd|addons/module_authoring/|assets/placeholders/module_tiles\.svg|data/module_templates\.json|data/module_tile_catalog\.json)|tools/godot_bridge\.py)

      - id: test-data-loader-schema
        name: Run DataLoader schema regression tests
        entry: python tools/test_data_loader_schema.py
        language: system
        pass_filenames: false
        files: ^(tools/(test_data_loader_schema|validate_data|sync_contracts)\.py|client/scripts/autoload/data_loader\.gd|client/scripts/contracts/.*\.gd|client/data/difficulty_profiles\.json|docs/词表与契约\.md)$

      - id: lint-gdscript-rules
        name: Run first-tier GDScript project lint
        entry: python tools/lint_gdscript_rules.py
        language: system
        files: ^(client/.*\.gd|tools/lint_gdscript_rules\.py|docs/词表与契约\.md)$
        exclude: ^client/addons/gut/

      - id: test-gdscript-lint-scoping
        name: Run GDScript lint scope regression tests
        entry: python tools/test_gdscript_lint_scoping.py
        language: system
        pass_filenames: false
        files: ^(tools/(lint_gdscript_rules|lint_semantic_rules|test_gdscript_lint_scoping)\.py|client/addons/gut/)

      - id: lint-project-rules
        name: Run second-tier project rules lint
        entry: python tools/lint_project_rules.py
        language: system
        pass_filenames: false
        always_run: true

      - id: test-project-rules-lint
        name: Run project rules lint regression tests
        entry: python tools/test_project_rules_lint.py
        language: system
        pass_filenames: false
        files: ^tools/(lint_project_rules|test_project_rules_lint)\.py$

      - id: test-godot-bridge
        name: Run Godot Bridge regression tests
        entry: python tools/test_godot_bridge.py
        language: system
        pass_filenames: false
        files: ^(tools/(godot_bridge|test_godot_bridge)\.py|client/tools/smoke_commands\.json|client/scripts/boot/formal_client_boot\.gd|\.pre-commit-config\.yaml|\.github/workflows/(docs-check|godot-runtime)\.yml)$

      - id: lint-semantic-rules
        name: Run third-tier semantic advisory lint
        entry: python tools/lint_semantic_rules.py
        language: system
        files: ^(client/.*\.gd|tools/lint_semantic_rules\.py|docs/词表与契约\.md)$
        exclude: ^client/addons/gut/

      - id: test-semantic-rules-lint
        name: Run semantic advisory lint regression tests
        entry: python tools/test_semantic_rules_lint.py
        language: system
        pass_filenames: false
        files: ^tools/(lint_semantic_rules|test_semantic_rules_lint)\.py$

      - id: test-steamworks-lab-toolchain
        name: Run Steamworks Lab toolchain regression tests
        entry: python tools/test_steamworks_lab_toolchain.py
        language: system
        pass_filenames: false
        files: ^(tools/(steamworks_lab_toolchain|test_steamworks_lab_toolchain)\.py|output/steamworks_lab/steam_appid\.txt)$

      - id: docs-health-check
        name: Run docs health check
        entry: python tools/docs_health_check.py
        language: system
        pass_filenames: false
        always_run: true

      - id: staged-whitespace-check
        name: Fix/check staged whitespace
        entry: python tools/check_staged_whitespace.py
        language: system
        pass_filenames: false
        always_run: true
